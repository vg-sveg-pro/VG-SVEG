
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VG-SVEG PRO</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070a12;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:28px 12px;background:#101a2d}
h1{color:#00eaff;text-shadow:0 0 15px #00eaff}
button{background:#00d9ff;color:#001018;border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
section{padding:16px;margin:14px;background:#111c30;border:1px solid #17465d;border-radius:15px}
input,select{width:100%;padding:12px;margin:8px 0;background:#07101e;color:white;border:1px solid #00cfff;border-radius:9px}
.item{display:flex;gap:8px;align-items:center;margin:8px 0}
.item span{flex:1;overflow-wrap:anywhere}
#home{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}
#app{display:none}
nav{position:sticky;bottom:0;background:#08101d;padding:12px;display:flex;justify-content:space-around}
nav button{padding:10px;font-size:12px}
</style>
</head>
<body>

<div id="home">
<h1>VG-SVEG PRO</h1>
<p>FREE FIRE GAMING TOOLS</p>
<button onclick="startApp()">START NOW</button>
</div>

<div id="app">
<header>
<h1>VG-SVEG PRO</h1>
<p>ULTIMATE GAMING TOOLS</p>
</header>

<section id="names">
<h2>🔥 Stylish Name Generator</h2>
<input id="playerName" placeholder="अपना नाम लिखो">
<button onclick="makeNames()">Generate Names</button>
<div id="nameResults"></div>
</section>

<section id="bio">
<h2>💎 Gaming Bio</h2>
<div id="bioResults"></div>
</section>

<section>
<h2>🌍 Country Name Styles</h2>
<div id="countryResults"></div>
</section>

<section>
<h2>🎨 Bio Color Codes</h2>
<select id="color">
<option value="[FF0000]">Red</option>
<option value="[00FF00]">Green</option>
<option value="[00FFFF]">Cyan</option>
<option value="[FFFF00]">Yellow</option>
<option value="[FF00FF]">Pink</option>
<option value="[FFFFFF]">White</option>
</select>
<input id="bioText" placeholder="अपना Bio लिखो">
<button onclick="makeColorBio()">Create Bio</button>
<div id="colorResult"></div>
</section>

<section>
<h2>🎯 Sensitivity Settings</h2>
<select id="device">
<option>Low End Phone</option>
<option>Mid Range Phone</option>
<option>High End Phone</option>
</select>
<select id="style">
<option>Headshot</option>
<option>Balanced</option>
<option>Rush Gameplay</option>
</select>
<button onclick="getSensitivity()">Get Settings</button>
<div id="sensitivityResult"></div>
</section>

<section>
<h2>✨ Gaming Symbols</h2>
<div id="symbols"></div>
</section>

<section>
<h2>🔗 Follow Us</h2>
<p><a href="https://www.youtube.com/@Karan_live_ffx" target="_blank">YouTube Channel</a></p>
<p><a href="https://t.me/vgsvegpro" target="_blank">Telegram Channel</a></p>
</section>

<nav>
<button onclick="go('names')">Names</button>
<button onclick="go('bio')">Bio</button>
<button onclick="go('symbols')">Symbols</button>
<button onclick="go('sensitivityResult')">Settings</button>
</nav>
</div>

<script>
function startApp(){
 document.getElementById('home').style.display='none';
 document.getElementById('app').style.display='block';
}
function copyText(text){
 if(navigator.clipboard){
  navigator.clipboard.writeText(text).then(()=>alert('Copied!'));
 }else{
  let t=document.createElement('textarea');
  t.value=text;document.body.appendChild(t);
  t.select();document.execCommand('copy');t.remove();
  alert('Copied!');
 }
}
function addItem(parent,text){
 let div=document.createElement('div');
 div.className='item';
 let span=document.createElement('span');
 span.textContent=text;
 let btn=document.createElement('button');
 btn.textContent='COPY';
 btn.onclick=()=>copyText(text);
 div.append(span,btn);
 parent.appendChild(div);
}
function makeNames(){
 let n=document.getElementById('playerName').value.trim();
 if(!n)return alert('नाम लिखो');
 let box=document.getElementById('nameResults');
 box.innerHTML='';
 ['꧁༒'+n+'༒꧂','亗'+n+'亗','『'+n+'』','★彡'+n+'彡★','乂'+n+'乂','么'+n+'么'].forEach(x=>addItem(box,x));
}
let bios=[
'亗 NO MERCY 亗','⚡ BORN TO WIN ⚡',
'꧁ KING OF HEADSHOT ꧂','🔥 NEVER GIVE UP 🔥',
'『 PRO PLAYER 』','亗 ONE TAP MASTER 亗'
];
bios.forEach(x=>addItem(document.getElementById('bioResults'),x));

['🇮🇳 INDIA','🇧🇷 BRAZIL','🇯🇵 JAPAN'].forEach(x=>addItem(document.getElementById('countryResults'),x));

function makeColorBio(){
 let text=document.getElementById('bioText').value;
 let color=document.getElementById('color').value;
 if(!text)return alert('Bio लिखो');
 let result=color+text;
 let box=document.getElementById('colorResult');
 box.innerHTML='';
 addItem(box,result);
}
function getSensitivity(){
 let d=document.getElementById('device').value;
 let s=document.getElementById('style').value;
 let values={
 'Low End Phone':[185,180,170,160,100],
 'Mid Range Phone':[190,185,175,165,100],
 'High End Phone':[195,190,180,170,100]
 };
 let v=values[d];
 if(s==='Rush Gameplay')v=[195,190,185,175,100];
 if(s==='Balanced')v=[180,175,165,155,100];
 let labels=['General','Red Dot','2x Scope','4x Scope','Free Look'];
 let box=document.getElementById('sensitivityResult');
 box.innerHTML='<p>Starter settings — अपने गेम में टेस्ट करके एडजस्ट करें।</p>';
 labels.forEach((x,i)=>addItem(box,x+': '+v[i]));
}
let symbols=['亗','么','乂','〆','彡','★','☆','ツ','࿐','꧁','꧂','༒','♛','♕','⚡','🔥','『','』','✿','✓'];
symbols.forEach(x=>addItem(document.getElementById('symbols'),x));

function go(id){
 let el=document.getElementById(id);
 if(el)el.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
